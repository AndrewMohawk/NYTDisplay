[env:reterminal_e1004]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#6a313a19f06994909627250a5e082e637bd34ff6
board = seeed-xiao-esp32-s3-sense
framework = arduino
extra_scripts = pre:scripts/framework_includes.py
upload_speed = 115200
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_32mb.csv
board_upload.flash_size = 32MB
build_flags =
    -D BOARD_HAS_PSRAM
lib_deps =
    https://github.com/Seeed-Projects/Seeed_GxEPD2.git#1100ea37c16b910fd79152f4250c13d802b9c20b
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
lib_ldf_mode = deep+
